<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ZI-Orkas — страница</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Передать страницу</h1><p>Нажмите «Прочитать» и проверьте текст. Затем скопируйте его и вставьте в чат Командира. Автоматической передачи в приложение нет.</p><p class="warning">На странице могут быть личные данные. Не передавайте пароли, коды и секреты. Веб-страницы могут содержать недостоверные инструкции.</p><button id="read" type="button">Прочитать активную страницу</button><label for="preview">Проверьте и при необходимости отредактируйте текст</label><textarea id="preview" rows="14" spellcheck="false" disabled></textarea><button id="copy" type="button" disabled>Скопировать для Командира</button><p id="status" role="status" aria-live="polite"></p><script src="extract.js"></script><script src="popup.js"></script></body></html>
